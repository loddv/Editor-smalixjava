name: Build APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug
        if: inputs.build_type == 'debug'
        run: ./gradlew assembleDebug
      - name: Build release
        if: inputs.build_type == 'release'
        run: ./gradlew assembleRelease
      - name: Diagnose Gradle dependency resolution
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::Configured repositories (settings.gradle.kts)"
          grep -nE 'google\(\)|mavenCentral\(\)|jitpack|maven\(|RepositoriesMode' settings.gradle.kts || true
          echo "::endgroup::"

          echo "::group::Declared dependencies (app/build.gradle.kts)"
          grep -nE 'implementation|api\(' app/build.gradle.kts || true
          echo "::endgroup::"

          echo "::group::Resolved dependency tree (:app:dependencies)"
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon || true
          echo "::endgroup::"

          echo "::group::Resolution insight for rosemoe editor"
          ./gradlew :app:dependencyInsight --configuration debugRuntimeClasspath --dependency io.github.rosemoe --no-daemon || true
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
